# Lightweight auto-build: every push to main produces an installable APK
# as a run artifact, no release needed. Full platform builds and GitHub
# releases stay in build.yml (release event / manual dispatch).
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "screenshots/**"
      - "fastlane/**"
      - ".github/FUNDING.yml"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.2"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Get dependencies
        run: flutter pub get

      - name: Read version
        id: version
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | sed 's/^version: //' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build APKs
        run: |
          flutter build apk --release
          flutter build apk --split-per-abi --release

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
            artifacts/openlib-android-universal-${{ steps.version.outputs.version }}-${{ github.run_number }}.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            artifacts/openlib-android-arm64-${{ steps.version.outputs.version }}-${{ github.run_number }}.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/*.apk
          retention-days: 14
