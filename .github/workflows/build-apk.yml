# Lightweight auto-build: every push to main produces an installable APK
# as a run artifact, no release needed. Full platform builds and GitHub
# releases stay in build.yml (release event / manual dispatch).
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "screenshots/**"
      - "fastlane/**"
      - ".github/FUNDING.yml"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.2"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Get dependencies
        run: flutter pub get

      - name: Read version
        id: version
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | sed 's/^version: //' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build APKs
        run: |
          flutter build apk --release
          flutter build apk --split-per-abi --release

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
            artifacts/openlib-android-universal-${{ steps.version.outputs.version }}-${{ github.run_number }}.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            artifacts/openlib-android-arm64-${{ steps.version.outputs.version }}-${{ github.run_number }}.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/*.apk
          retention-days: 14

  # Keep a rolling "latest" pre-release so every push is downloadable from
  # the Releases page without manually cutting a version. Formal, versioned
  # releases stay with build.yml (release event).
  release-latest:
    name: Publish rolling latest release
    needs: [build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | sed 's/^version: //' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts

      - name: Normalize asset names
        run: |
          mkdir -p release
          cp artifacts/*.apk release/
          cd release
          VER="${{ steps.version.outputs.version }}"
          # Fixed names so each build replaces the previous assets instead
          # of accumulating one set per run.
          for f in openlib-android-*-"$VER"-*.apk; do
            [ -e "$f" ] || continue
            base="${f%-"$VER"-*.apk}"
            mv "$f" "${base}-latest.apk"
          done
          ls -la

      - name: Delete previous latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true

      - name: Create rolling latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build (v${{ steps.version.outputs.version }})"
          prerelease: true
          body: |
            自动构建 / Automated build from `main` @ ${{ github.sha }}

            - 版本 / Version: v${{ steps.version.outputs.version }}
            - 构建 / Run: #${{ github.run_number }}
            - 正式版本发布请在 Releases 页面创建 Release，全平台安装包由 Build and Release 工作流自动附加。

            APK 选择：regular 手机用 **arm64**，不确定就用 **universal**。
          files: release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
